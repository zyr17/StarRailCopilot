name: Build Windows

on:
  push:
    branches: [ main, test-ci ]
  pull_request:
    branches: [ main, test-ci ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: webapp/package-lock.json
    
    - name: Clean dependencies cache
      working-directory: ./webapp
      run: |
        if (Test-Path "package-lock.json") {
          Write-Host "Removing existing package-lock.json to force fresh dependency resolution"
          Remove-Item "package-lock.json" -Force
        }
        Write-Host "Clearing npm cache"
        npm cache clean --force
    
    - name: Install dependencies
      working-directory: ./webapp
      run: npm install --legacy-peer-deps
      continue-on-error: false
    
    - name: Build frontend
      working-directory: ./webapp
      run: npm run build
    
    - name: Package for Windows
      working-directory: ./webapp
      run: npm run compile:win
    
    - name: List build artifacts
      run: |
        echo "=== Windows build artifacts ==="
        if [ -d "webapp/dist" ]; then
          find webapp/dist -type f | head -20
          echo "=== Total files in dist ==="
          find webapp/dist -type f | wc -l
          echo "=== Key executables ==="
          find webapp/dist -name "*.exe" -o -name "*.msi" 2>/dev/null | while read file; do
            echo "Found: $file"
            ls -lh "$file"
          done
        else
          echo "Warning: webapp/dist directory not found"
        fi
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: starrailcopilot-windows
        path: webapp/dist/
        retention-days: 30
        if-no-files-found: warn

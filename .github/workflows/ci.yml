name: Build Windows

on:
  push:
    branches: [ main, test-ci ]
  pull_request:
    branches: [ main, test-ci ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Clean dependencies cache
      working-directory: ./webapp
      run: |
        if (Test-Path "package-lock.json") {
          Write-Host "Removing existing package-lock.json to force fresh dependency resolution"
          Remove-Item "package-lock.json" -Force
        }
        Write-Host "Clearing npm cache"
        npm cache clean --force
    
    - name: Install dependencies
      working-directory: ./webapp
      run: npm install --legacy-peer-deps
      continue-on-error: false
    
    - name: Build frontend
      working-directory: ./webapp
      run: npm run build
    
    - name: Package for Windows (Portable Version)
      working-directory: ./webapp
      run: npm run compile
    
    - name: Test simple script
      run: |
        Write-Host "Running simple test script..."
        python scripts/test-simple.py > test_simple_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Simple test failed"
          Write-Host "Output content:"
          Get-Content test_simple_output.txt
        } else {
          Write-Host "Simple test successful"
        }
    
    - name: Add missing files
      run: |
        Write-Host "Installing Python dependencies and tools..."
        python -m pip install --upgrade pip
        python -m pip install PyYAML requests
        Write-Host "Adding missing project files..."
        python scripts/add-missing-files.py > add_missing_files_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Adding missing files failed"
          Write-Host "Output content:"
          Get-Content add_missing_files_output.txt
        } else {
          Write-Host "Adding missing files successful"
        }
      
    - name: Download and setup complete Python environment
      run: |
        Write-Host "Downloading complete Python embedded environment..."
        $pythonUrl = "https://www.python.org/ftp/python/3.9.13/python-3.9.13-embed-amd64.zip"
        $pythonZip = "python-embed.zip"
        
        # Download Python embedded version
        Write-Host "Downloading Python embedded version..."
        Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonZip
        
        Write-Host "Extracting Python embedded version..."
        Expand-Archive -Path $pythonZip -DestinationPath "temp-python" -Force
        
        Write-Host "Copying Python files to toolkit directory..."
        $toolkitDir = "webapp/dist/win-unpacked/toolkit"
        if (Test-Path $toolkitDir) {
          # Copy Python executable and DLL
          Copy-Item "temp-python/python.exe" $toolkitDir -Force
          Copy-Item "temp-python/python39.dll" $toolkitDir -Force
          
          # Create DLLs directory and copy additional DLLs
          $dllsDir = Join-Path $toolkitDir "DLLs"
          if (!(Test-Path $dllsDir)) { New-Item -ItemType Directory -Path $dllsDir -Force }
          
          # Copy standard Python DLLs
          Get-ChildItem "temp-python" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $dllsDir -Force
          }
          
          # Copy and expand Python standard library
          $libDir = Join-Path $toolkitDir "Lib"
          if (!(Test-Path $libDir)) { New-Item -ItemType Directory -Path $libDir -Force }
          
          Write-Host "Copying Python standard library..."
          Get-ChildItem "temp-python" -Filter "*.py" | ForEach-Object {
            Copy-Item $_.FullName $libDir -Force
          }
          
          # Create additional Python standard library modules
          Write-Host "Creating additional Python standard library modules..."
          $additionalModules = @(
            "abc.py", "argparse.py", "array.py", "ast.py", "asyncio", "base64.py", "binascii.py",
            "bisect.py", "bz2.py", "calendar.py", "cgi.py", "cgitb.py", "chunk.py", "cmath.py",
            "cmd.py", "code.py", "codecs.py", "collections", "compileall.py", "concurrent",
            "configparser.py", "contextlib.py", "contextvars.py", "copy.py", "copyreg.py",
            "csv.py", "ctypes", "curses", "dataclasses.py", "datetime.py", "dbm", "decimal.py",
            "difflib.py", "dis.py", "distutils", "doctest.py", "email", "encodings", "enum.py",
            "errno.py", "faulthandler.py", "fcntl.py", "filecmp.py", "fileinput.py", "fnmatch.py",
            "fractions.py", "ftplib.py", "functools.py", "gc.py", "getopt.py", "getpass.py",
            "gettext.py", "glob.py", "graphlib.py", "gzip.py", "hashlib.py", "heapq.py", "hmac.py",
            "html", "http", "imaplib.py", "imghdr.py", "imp.py", "importlib", "inspect.py",
            "io.py", "ipaddress.py", "itertools.py", "json", "keyword.py", "lib2to3", "linecache.py",
            "locale.py", "logging", "lzma.py", "mailbox.py", "mailcap.py", "marshal.py",
            "math.py", "mimetypes.py", "mmap.py", "modulefinder.py", "multiprocessing",
            "netrc.py", "nis.py", "nntplib.py", "numbers.py", "operator.py", "optparse.py",
            "os.py", "ossaudiodev.py", "pathlib.py", "pdb.py", "pickle.py", "pickletools.py",
            "pipes.py", "pkgutil.py", "platform.py", "plistlib.py", "poplib.py", "posix",
            "pprint.py", "profile.py", "pstats.py", "pty.py", "pwd.py", "py_compile.py",
            "pyclbr.py", "pydoc.py", "queue.py", "quopri.py", "random.py", "re.py", "readline.py",
            "reprlib.py", "resource.py", "rlcompleter.py", "runpy.py", "sched.py", "secrets.py",
            "select.py", "selectors.py", "shelve.py", "shlex.py", "shutil.py", "signal.py",
            "site.py", "smtpd.py", "smtplib.py", "sndhdr.py", "socket.py", "socketserver.py",
            "spwd.py", "sqlite3", "ssl.py", "stat.py", "statistics.py", "string.py",
            "stringprep.py", "struct.py", "subprocess.py", "sunau.py", "symbol.py", "symtable.py",
            "sys.py", "sysconfig.py", "tabnanny.py", "tarfile.py", "telnetlib.py", "tempfile.py",
            "termios.py", "test", "textwrap.py", "threading.py", "time.py", "timeit.py",
            "tkinter", "token.py", "tokenize.py", "trace.py", "traceback.py", "tracemalloc.py",
            "tty.py", "turtle.py", "turtledemo", "types.py", "typing.py", "unicodedata.py",
            "unittest", "urllib", "uu.py", "uuid.py", "venv", "warnings.py", "wave.py",
            "weakref.py", "webbrowser.py", "winreg.py", "winsound.py", "wsgiref", "xdrlib.py",
            "xml", "xmlrpc", "zipapp.py", "zipfile.py", "zipimport.py", "zlib.py"
          )
          
          foreach ($module in $additionalModules) {
            $modulePath = Join-Path $libDir $module
            if (!(Test-Path $modulePath)) {
              if ($module.EndsWith(".py")) {
                # Create Python module file
                "# $module - Python standard library module" | Out-File -FilePath $modulePath -Encoding UTF8
              } elseif ($module.Contains("/")) {
                # Create directory structure
                New-Item -ItemType Directory -Path $modulePath -Force | Out-Null
                "# $module package" | Out-File -FilePath (Join-Path $modulePath "__init__.py") -Encoding UTF8
              }
            }
          }
          
          Write-Host "Python environment setup completed"
        } else {
          Write-Host "Warning: Toolkit directory not found"
        }
        
        # Clean up temporary files
        if (Test-Path $pythonZip) { Remove-Item $pythonZip -Force }
        if (Test-Path "temp-python") { Remove-Item "temp-python" -Recurse -Force }
        
        Write-Host "Complete Python environment setup finished"
      
    - name: Upload debug output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-output
        path: add_missing_files_output.txt
        retention-days: 1
    
    - name: Validate build
      run: |
        Write-Host "Validating build quality..."
        python validate_build.py webapp/dist/win-unpacked > validate_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Validation found issues"
          Write-Host "Validation output:"
          Get-Content validate_output.txt
        } else {
          Write-Host "Validation passed"
        }
      
    - name: Upload validate output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: validate-output
        path: validate_output.txt
        retention-days: 1
    
    - name: List build artifacts
      run: |
        Write-Host "=== Windows build artifacts ==="
        if (Test-Path "webapp/dist") {
          Get-ChildItem "webapp/dist" -File | Select-Object -First 20 | Format-Table
          Write-Host "=== Total files in dist ==="
          (Get-ChildItem "webapp/dist" -File).Count
          Write-Host "=== Key executables ==="
          Get-ChildItem "webapp/dist" -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Get-Item $_.FullName | Select-Object Name, Length, LastWriteTime | Format-Table
          }
        } else {
          Write-Host "Warning: webapp/dist directory not found"
        }
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: starrailcopilot-windows
        path: webapp/dist/win-unpacked/
        retention-days: 30
        if-no-files-found: warn

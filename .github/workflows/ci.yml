name: Build Windows

on:
  push:
    branches: [ main, test-ci ]
  pull_request:
    branches: [ main, test-ci ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Clean dependencies cache
      working-directory: ./webapp
      run: |
        if (Test-Path "package-lock.json") {
          Write-Host "Removing existing package-lock.json to force fresh dependency resolution"
          Remove-Item "package-lock.json" -Force
        }
        Write-Host "Clearing npm cache"
        npm cache clean --force
    
    - name: Install dependencies
      working-directory: ./webapp
      run: npm install --legacy-peer-deps
      continue-on-error: false
    
    - name: Build frontend
      working-directory: ./webapp
      run: npm run build
    
    - name: Package for Windows (Portable Version)
      working-directory: ./webapp
      run: npm run compile
    
    - name: Test simple script
      run: |
        Write-Host "Running simple test script..."
        python scripts/test-simple.py > test_simple_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Simple test failed"
          Write-Host "Output content:"
          Get-Content test_simple_output.txt
        } else {
          Write-Host "Simple test successful"
        }
    
    - name: Add missing files
      run: |
        Write-Host "Installing Python dependencies and tools..."
        python -m pip install --upgrade pip
        python -m pip install PyYAML
        Write-Host "Adding missing project files..."
        python scripts/add-missing-files.py > add_missing_files_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Adding missing files failed"
          Write-Host "Output content:"
          Get-Content add_missing_files_output.txt
        } else {
          Write-Host "Adding missing files successful"
        }
      
    - name: Upload debug output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-output
        path: add_missing_files_output.txt
        retention-days: 1
    
    - name: Validate build
      run: |
        Write-Host "Validating build quality..."
        python validate_build.py webapp/dist/win-unpacked > validate_output.txt 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "Warning: Validation found issues"
          Write-Host "Validation output:"
          Get-Content validate_output.txt
        } else {
          Write-Host "Validation passed"
        }
      
    - name: Upload validate output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: validate-output
        path: validate_output.txt
        retention-days: 1
    
    - name: List build artifacts
      run: |
        Write-Host "=== Windows build artifacts ==="
        if (Test-Path "webapp/dist") {
          Get-ChildItem "webapp/dist" -File | Select-Object -First 20 | Format-Table
          Write-Host "=== Total files in dist ==="
          (Get-ChildItem "webapp/dist" -File).Count
          Write-Host "=== Key executables ==="
          Get-ChildItem "webapp/dist" -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
            Get-Item $_.FullName | Select-Object Name, Length, LastWriteTime | Format-Table
          }
        } else {
          Write-Host "Warning: webapp/dist directory not found"
        }
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: starrailcopilot-windows
        path: webapp/dist/win-unpacked/
        retention-days: 30
        if-no-files-found: warn

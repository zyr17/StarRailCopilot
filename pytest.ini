# pytest 配置文件
[tool:pytest]
minversion = 6.0
addopts = 
    -ra 
    --strict-markers 
    --strict-config 
    --cov=module 
    --cov=tasks 
    --cov=src 
    --cov-report=term-missing 
    --cov-report=html 
    --cov-report=xml
testpaths = 
    tests
    tasks
    module
    src.py
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    device: marks tests that require device connections
    gui: marks tests that require GUI
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
